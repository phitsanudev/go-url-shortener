services:
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: url_shortener_backend
    depends_on:
      - postgres
      - redis
    environment:
      APP_PORT: 8080
      BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://app:app@postgres:5432/url_shortener?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      URL_TTL_MINUTES: 10
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: url_shortener_frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
